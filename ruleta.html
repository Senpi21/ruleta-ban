/* Transiciones más orgánicas para la pantalla de stream. */
#panel {

<script>
const firebaseConfig = {
  apiKey: "X",
  databaseURL: "https://ruleta-211c5-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const confettiCanvas = document.getElementById("confettiCanvas");
const confettiContext = confettiCanvas.getContext("2d");
let confettiFrame = null;

function lanzarConfeti(){
  if(!confettiContext) return;

  if(confettiFrame) cancelAnimationFrame(confettiFrame);

  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  const width = window.innerWidth;
  const height = window.innerHeight;
  confettiCanvas.width = width * pixelRatio;
  confettiCanvas.height = height * pixelRatio;
  confettiContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

  const colores = ["#f9a8d4", "#fef08a", "#a7f3d0", "#93c5fd", "#c4b5fd", "#fda4af"];
  const particulas = Array.from({length: 180}, (_, indice) => ({
    x: width / 2 + (Math.random() - .5) * 120,
    y: height * .36 + (Math.random() - .5) * 30,
    vx: (Math.random() - .5) * 13,
    vy: -Math.random() * 11 - 4,
    gravedad: .16 + Math.random() * .08,
    giro: Math.random() * Math.PI,
    velocidadGiro: (Math.random() - .5) * .28,
    tamaño: 7 + Math.random() * 8,
    color: colores[indice % colores.length],
  }));

  const inicio = performance.now();
  const duracion = 3000;

  function animar(ahora){
    const progreso = ahora - inicio;
    confettiContext.clearRect(0, 0, width, height);

    particulas.forEach(particula => {
      particula.x += particula.vx;
      particula.y += particula.vy;
      particula.vy += particula.gravedad;
      particula.vx *= .992;
      particula.giro += particula.velocidadGiro;

      confettiContext.save();
      confettiContext.translate(particula.x, particula.y);
      confettiContext.rotate(particula.giro);
      confettiContext.fillStyle = particula.color;
      confettiContext.fillRect(-particula.tamaño / 2, -particula.tamaño / 3, particula.tamaño, particula.tamaño * .65);
      confettiContext.restore();
    });

    if(progreso < duracion){
      confettiFrame = requestAnimationFrame(animar);
    } else {
      confettiContext.clearRect(0, 0, width, height);
      confettiFrame = null;
    }
  }

  confettiFrame = requestAnimationFrame(animar);
}

db.ref(".info/connected").on("value", snap => {
  const status = document.getElementById("firebaseStatus");
  if(!status) return;
  const connected = snap.val() === true;
  status.textContent = connected ? "CONECTADO" : "SIN CONEXIÓN";
  status.className = connected ? "connected" : "disconnected";
});

let players = [];
let currentRotation = 0;
let spinning = false;
let eliminationMode = false;
let muerteSubita = false;
let joinEnabled = true;
let updatingFromFirebase = false;
let modoRuleta = "ban";
let pendingPlayers = null;

const wheel = document.getElementById("wheel");
const input = document.getElementById("listInput");
const spinBtn = document.getElementById("spinBtn");

const colors = ["#2e1065","#4c1d95","#5b21b6","#6d28d9","#7c3aed","#8b5cf6","#a78bfa","#c4b5fd"];

function normalizarJugadores(data){
  if(Array.isArray(data)){
    return data.map(x => String(x).trim()).filter(Boolean);
  }
  if(data && typeof data === "object"){
    return Object.keys(data).map(x => x.trim()).filter(Boolean);
  }
  return [];
}

function aplicarJugadores(data){
  players = normalizarJugadores(data);
  input.value = players.join("\n");
  const contador = document.getElementById("playerCount");
  if(contador) contador.innerText = players.length;
  drawWheel();
  actualizarMuerteSubita();
}

function aplicarEstadoUnirse(estado){
  joinEnabled = estado;
  const btn = document.getElementById("joinBtn");
  btn.innerText = joinEnabled ? "UNIRSE: ON" : "UNIRSE: OFF";
  btn.style.background = joinEnabled ? "#8b5cf6" : "#9333ea";

  if (joinEnabled) {
    spinBtn.style.background = "#475569";
    spinBtn.style.boxShadow = "none";
    spinBtn.style.cursor = "not-allowed";
  } else {
    spinBtn.style.background = "#7c3aed";
    spinBtn.style.boxShadow = "0 0 20px #7c3aed";
    spinBtn.style.cursor = "pointer";
  }
}

// --- CARGAR JUGADORES NORMALES ---
db.ref("players").on("value", snap => {
  const data = normalizarJugadores(snap.val());
  if(spinning){
    pendingPlayers = data;
    return;
  }
  updatingFromFirebase = true;
  aplicarJugadores(data);
  updatingFromFirebase = false;
});

// --- CONTROL DE UNIRSE Y FEEDBACK DEL BOTÓN GIRAR ---
db.ref("joinEnabled").on("value", snap => {
  aplicarEstadoUnirse(snap.val() ?? true);
});

db.ref("modoRuleta").on("value", snap => {
  const modo = snap.val() || "ban";
  modoRuleta = modo;
  aplicarModoRuleta();
});

function aplicarModoRuleta(){
  const info = document.getElementById("infoBox");
  const header = document.querySelector("#header h1");

  if(modoRuleta === "subs"){
    header.innerText = "Ruleta de SUBS - Zidoshifu";
    info.innerHTML = "<b>RULETA DE SUBS</b><br>Solo suscriptores: escribe <b>!sub</b> para entrar";
    info.style.border = "1px solid #facc15";
    info.style.boxShadow = "0 0 25px rgba(250,204,21,0.65)";
    info.style.background = "rgba(113,63,18,0.9)";
  } else if(modoRuleta === "zing"){
    header.innerText = "ZING DIBUJO - Zidoshifu";
    info.innerHTML = "<b>ZING DIBUJO</b><br>Escribe <b>!Unirme</b> para entrar";
    info.style.border = "1px solid #c084fc";
    info.style.boxShadow = "0 0 25px rgba(192,132,252,0.7)";
    info.style.background = "rgba(88,28,135,0.9)";
  } else {
    header.innerText = "Ruleta de BAN - Zidoshifu";
    info.innerHTML = "Escribe <b>!BAN</b> en el chat para unirte";
    info.style.border = "1px solid #a78bfa";
    info.style.boxShadow = "0 0 20px rgba(167,139,250,0.4)";
    info.style.background = "rgba(30,41,59,0.9)";
  }
}

input.addEventListener("input", () => {
  if (updatingFromFirebase || spinning) return;
  const lista = input.value.split("\n").map(x => x.trim()).filter(Boolean);players = lista;
  drawWheel();
  actualizarMuerteSubita();
  db.ref("players").transaction(() => players);
});

function toggleJoin(){
  if(spinning) return;
  joinEnabled = !joinEnabled;
  db.ref("joinEnabled").set(joinEnabled);
}
function drawWheel(){
  if(!players.length){
    wheel.innerHTML="";
    wheel.style.background="transparent";
    return;
  }

  const angle = 360 / players.length;
  let gradient="";
  wheel.innerHTML="";

  players.forEach((p,i)=>{
    const start=i*angle;
    gradient+=`${colors[i%colors.length]} ${start}deg ${start+angle}deg,`;

    const text=document.createElement("div");
    text.innerText=p;
    text.style.position="absolute";
    text.style.left="50%";
    text.style.top="50%";
    text.style.transform=`rotate(${start+angle/2}deg) translate(0,-160px) rotate(90deg)`;

    let size = 16;
    if (p.length > 10) size = 14;
    if (p.length > 14) size = 12;
    if (p.length > 18) size = 10;
    if (players.length > 12) size -= 1;
    if (players.length > 24) size -= 2;
    if (size < 7) size = 7;

    text.style.fontSize = size + "px";
    text.style.width="120px";
    text.style.marginLeft="-60px";
    text.style.textAlign="center";
    text.style.fontWeight="bold";
    text.style.textShadow="0 0 5px rgba(0,0,0,0.5)";
    wheel.appendChild(text);
  });

  wheel.style.background=`conic-gradient(${gradient.slice(0,-1)})`;
}

const tickSound = document.getElementById("tickSound");
const bellSound = document.getElementById("bellSound");
const celebrationSound = document.getElementById("celebrationSound");
let tickingRAF = null;
let lastTickTime = 0;
let lastSegment = -1;
const SPIN_DURATION_SECONDS = 13.5;
const SPIN_TURNS = 12;

function toggleElimination(){
  if(spinning) return;
  eliminationMode = !eliminationMode;
  const btn = document.getElementById("elimBtn");
  btn.innerText = eliminationMode ? "ELIMINACIÓN: ON" : "ELIMINACIÓN: OFF";
  btn.style.background = eliminationMode ? "#8b5cf6" : "#9333ea";
  actualizarMuerteSubita();
}

function actualizarMuerteSubita(){
  const btn = document.getElementById("suddenBtn");
  const disponible = eliminationMode && players.length === 2;

  btn.classList.toggle("visible", disponible);

  if(!disponible && muerteSubita){
    muerteSubita = false;
    btn.innerText = "☠ MUERTE SÚBITA: OFF";
    btn.classList.remove("active");
  }
}

function toggleMuerteSubita(){
  if(spinning || !eliminationMode || players.length !== 2) return;
  muerteSubita = !muerteSubita;
  const btn = document.getElementById("suddenBtn");
  btn.innerText = muerteSubita ? "☠ MUERTE SÚBITA: ON" : "☠ MUERTE SÚBITA: OFF";
  btn.classList.toggle("active", muerteSubita);
}

function showResult(t){
  const box=document.getElementById("resultBox");
  const txt=document.getElementById("resultText");
  txt.innerText=t;
  box.classList.add("active");
  setTimeout(()=>box.classList.remove("active"),3000);
}

function indiceAleatorio(maximo){
  if(window.crypto && window.crypto.getRandomValues){
    const limite = Math.floor(2 ** 32 / maximo) * maximo;
    const valor = new Uint32Array(1);
    do {
      window.crypto.getRandomValues(valor);
    } while(valor[0] >= limite);
    return valor[0] % maximo;
  }
  return Math.floor(Math.random() * maximo);
}

function spin(){
  // --- CORRECCIÓN SOLICITADA: Bloqueo si Unirse está ON ---
  if (joinEnabled) {
    showResult("(UNIRSE: OFF) PARA GIRAR");
    return;
  }

  if(!players.length || spinning) return;

  if(eliminationMode && muerteSubita && players.length === 1){
    showResult("GANADOR: " + players[0]);
    return;
  }

  const jugadoresDelGiro = [...players];
  spinning=true;
  input.disabled=true;
  startRealTicking();
  
  spinBtn.innerText="GIRANDO...";
  spinBtn.disabled=true;

  const angle = 360 / jugadoresDelGiro.length;
  const randomIndex = indiceAleatorio(jugadoresDelGiro.length);
  const targetAngle = randomIndex * angle + angle / 2;

  // Rotación: vueltas base + compensación para que el puntero (izquierda) marque bien
  const targetRotation = 270 - targetAngle;
  const ajuste = ((targetRotation - currentRotation) % 360 + 360) % 360;
  const finalRotation = currentRotation + (360 * SPIN_TURNS) + ajuste;

  wheel.style.transition = `transform ${SPIN_DURATION_SECONDS}s cubic-bezier(0.30, 0.02, 0.18, 1)`;
  wheel.style.transform=`rotate(${finalRotation}deg)`;
  currentRotation = finalRotation;

  wheel.addEventListener("transitionend", function handler(event){
    if(event.propertyName !== "transform") return;
    wheel.removeEventListener("transitionend", handler);
    stopRealTicking();

    spinning=false;
    input.disabled=false;
    spinBtn.innerText="GIRAR";
    spinBtn.disabled=false;

    const ganador = jugadoresDelGiro[randomIndex];

    if(pendingPlayers !== null){
      aplicarJugadores(pendingPlayers);
      pendingPlayers = null;
    }

    if(eliminationMode){
      const finalMuerteSubita = muerteSubita && jugadoresDelGiro.length === 2;
      const superviviente = finalMuerteSubita
        ? jugadoresDelGiro[1 - randomIndex]
        : null;

      const indiceActual = players.indexOf(ganador);
      if(indiceActual !== -1) players.splice(indiceActual,1);
      input.value = players.join("\n");
      drawWheel();
      actualizarMuerteSubita();

      if(finalMuerteSubita){
        showResult("GANADOR: " + superviviente);
        guardarHistorial(superviviente);
        lanzarConfeti();
        celebrationSound.currentTime = 0;
        celebrationSound.play().catch(()=>{});
      } else {
        showResult("ELIMINADO: " + ganador);
        guardarHistorial(ganador);
        const sonidoEliminado = bellSound.cloneNode();
        sonidoEliminado.volume = 0.8;
        sonidoEliminado.play().catch(()=>{});
      } 
        db.ref("players").transaction(current => {
          const lista = normalizarJugadores(current);
          const indice = lista.indexOf(ganador);
          if(indice !== -1) lista.splice(indice, 1);
          return lista;
        });
      wheel.style.transition = "none";
      wheel.style.transform = "rotate(0deg)";
      currentRotation = 0;
      wheel.offsetHeight;
      wheel.style.transition = `transform ${SPIN_DURATION_SECONDS}s cubic-bezier(0.30, 0.02, 0.18, 1)`;
    } else {
      showResult("GANÓ: " + ganador); guardarHistorial(ganador);
    }
  });
}

function startRealTicking(){
  lastSegment = -1;
  function loop(){
    if(!spinning) return;
    const angle = 360 / players.length;
    const style = window.getComputedStyle(wheel);
    const matrix = new DOMMatrix(style.transform);
    let rotation = Math.atan2(matrix.b, matrix.a) * (180 / Math.PI);
    if(rotation < 0) rotation += 360;
    const pointerDeg = (360 - rotation + 270) % 360;
    const currentSegment = Math.floor(pointerDeg / angle);

    if(currentSegment !== lastSegment){
      const now = Date.now();
      if(now - lastTickTime > 70){ // Limita el audio sin perder tanto el ritmo de las casillas.
  lastTickTime = now;

  const tick = tickSound.cloneNode();

  tick.volume = 0.16; // Más suave durante la aceleración.

  tick.playbackRate = 0.96; // Un tono más natural y menos frenético.

  tick.play().catch(()=>{});
}
      lastSegment = currentSegment;
    }
    tickingRAF = requestAnimationFrame(loop);
  }
  loop();
}

function stopRealTicking(){
  if(tickingRAF){
    cancelAnimationFrame(tickingRAF);
    tickingRAF = null;
  }
}



// ===== BOT STATUS =====
db.ref("bot").on("value", snap => {
 const data = snap.val() || {};
 document.getElementById("botCanal").innerText = data.canal || "-";
 document.getElementById("botVersion").innerText = data.version || "-";

 const estado = document.getElementById("botEstado");
 const now = Math.floor(Date.now()/1000);
 const ping = data.last_ping || 0;

 if((now - ping) < 30){
   estado.innerText = "BOT: ONLINE";
   estado.style.color = "#4ade80";
 } else {
   estado.innerText = "BOT: OFFLINE";
   estado.style.color = "#f87171";
 }
});

db.ref("players").on("value", snap => {
  const el = document.getElementById("playerCount");
  if(el) el.innerText = normalizarJugadores(snap.val()).length;
});

function renderizarHistorial(historial){
 const box = document.getElementById("historyList");
 if(!box) return;
 box.replaceChildren();
 if(!Array.isArray(historial) || !historial.length){
   box.textContent = "Sin datos";
   return;
 }
 historial.forEach((nombre, indice) => {
   const linea = document.createElement("div");
   linea.textContent = `${indice + 1}. ${nombre}`;
   box.appendChild(linea);
 });
}

function guardarHistorial(nombre){
  const ref = db.ref("history");
  ref.transaction(actual => {
    const historial = Array.isArray(actual) ? actual.map(String) : [];
    return [nombre, ...historial].slice(0,5);
  });
}
db.ref("history").on("value", snap => {
  renderizarHistorial(Array.isArray(snap.val()) ? snap.val().map(String) : []);
});


function cambiarRuleta(){
  if(spinning) return;
  const cortina = document.getElementById("cortina");
  cortina.classList.add("activa");
  setTimeout(()=>{
    const modos = ["ban", "zing"];
    modoRuleta = modos[(modos.indexOf(modoRuleta) + 1) % modos.length];
    db.ref("modoRuleta").set(modoRuleta);
  },600);
  setTimeout(()=>{
    cortina.classList.remove("activa");
  },1200);
}
</script>
